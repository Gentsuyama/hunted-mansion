<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>HUNTED MANSION</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #000;
    height: 100%;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: #000; cursor: none;
    max-width: 100vw; max-height: 100vh;
    max-width: 100dvw; max-height: 100dvh;
    width: auto; height: auto;
    aspect-ratio: 1200 / 680;
    touch-action: none;
  }
  /* fontes embutidas (OFL) — ver js/fontes.js e Assets/Fontes/LEIAME.txt */
  @font-face { font-family: "HM Mono"; src: url(Assets/Fontes/HM-Mono-Regular.woff2) format("woff2");
               font-weight: 400; font-style: normal; font-display: block; }
  @font-face { font-family: "HM Mono"; src: url(Assets/Fontes/HM-Mono-Bold.woff2) format("woff2");
               font-weight: 700; font-style: normal; font-display: block; }
  @font-face { font-family: "HM Mono"; src: url(Assets/Fontes/HM-Mono-Italic.woff2) format("woff2");
               font-weight: 400; font-style: italic; font-display: block; }
  @font-face { font-family: "HM Mono"; src: url(Assets/Fontes/HM-Mono-BoldItalic.woff2) format("woff2");
               font-weight: 700; font-style: italic; font-display: block; }
  /* a letra à mão já nasce inclinada: a mesma face responde por normal e italic,
     para o navegador não entortar ainda mais */
  @font-face { font-family: "HM Script"; src: url(Assets/Fontes/HM-Script.woff2) format("woff2");
               font-weight: 400 700; font-style: normal; font-display: block; size-adjust: 112%; }
  @font-face { font-family: "HM Script"; src: url(Assets/Fontes/HM-Script.woff2) format("woff2");
               font-weight: 400 700; font-style: italic; font-display: block; size-adjust: 112%; }
</style>
</head>
<body>
<canvas id="game" width="1200" height="680"></canvas>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/fontes.js"></script>
<script src="js/lang/chaves.js"></script>
<script src="js/lang/en.js"></script>
<script src="js/lang/es.js"></script>
<script src="js/lang/fr.js"></script>
<script src="js/lang/de.js"></script>
<script src="js/lang/zh.js"></script>
<script src="js/lang/ja.js"></script>
<script src="js/audio.js"></script>
<script src="js/musica.js"></script>
<script src="js/sprites.js"></script>
<script src="js/tex.js"></script>
<script src="js/photo.js"></script>
<script src="js/mansion.js"></script>
<script src="js/mapa.js"></script>
<script src="js/game.js"></script>
<script src="js/live.js"></script>
<script src="js/souls.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/ritual.js"></script>
<script src="js/energia.js"></script>
<script src="js/planta.js"></script>
<script src="js/album.js"></script>
<script src="js/diario.js"></script>
<script src="js/sanidade.js"></script>
<script src="js/controle.js"></script>
<script src="js/intro.js"></script>
<script src="js/main.js"></script>
</body>
</html>
